spring.application.name=article-store
server.port=8081
spring.docker.compose.file=../compose.yaml
spring.docker.compose.lifecycle-management=start-only

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.serialization-mode=via-dto

springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.path=/api-test

spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=10
spring.rabbitmq.listener.simple.default-requeue-rejected=false