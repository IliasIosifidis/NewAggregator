<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ec8f2" />
      <stop offset="1" stop-color="#d4f4ff" />
    </linearGradient>

    <g id="cloud" fill="#ffffff">
      <ellipse cx="0" cy="0" rx="72" ry="36" />
      <circle cx="-48" cy="6" r="32" />
      <circle cx="50" cy="4" r="34" />
      <circle cx="8" cy="-24" r="38" />
    </g>

    <!-- Canopies use currentColor so each <use> can set its own green via `color`. -->
    <g id="tree">
      <rect x="-13" y="-115" width="26" height="115" rx="9" fill="#9a6331" />
      <circle cx="-46" cy="-118" r="46" fill="currentColor" />
      <circle cx="46" cy="-118" r="46" fill="currentColor" />
      <circle cx="0" cy="-158" r="68" fill="currentColor" />
      <circle cx="-24" cy="-182" r="20" fill="#ffffff" opacity="0.2" />
    </g>

    <g id="pine" stroke-linejoin="round">
      <rect x="-11" y="-55" width="22" height="55" rx="6" fill="#9a6331" />
      <path d="M0 -170 L80 -55 L-80 -55 Z" fill="currentColor" stroke="currentColor" stroke-width="16" />
      <path d="M0 -215 L64 -115 L-64 -115 Z" fill="currentColor" stroke="currentColor" stroke-width="16" />
      <path d="M0 -255 L46 -170 L-46 -170 Z" fill="currentColor" stroke="currentColor" stroke-width="16" />
    </g>

    <g id="flower">
      <path d="M0 0 V-26" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" />
      <g fill="currentColor">
        <circle cx="0" cy="-38" r="7" />
        <circle cx="11" cy="-30" r="7" />
        <circle cx="7" cy="-17" r="7" />
        <circle cx="-7" cy="-17" r="7" />
        <circle cx="-11" cy="-30" r="7" />
      </g>
      <circle cx="0" cy="-27" r="6" fill="#ffd43b" />
    </g>

    <g id="mushroom">
      <rect x="-9" y="-26" width="18" height="26" rx="6" fill="#fff4e0" />
      <path d="M-30 -22 Q-30 -58 0 -58 Q30 -58 30 -22 Z" fill="#ef4444" />
      <circle cx="-13" cy="-40" r="5" fill="#ffffff" />
      <circle cx="10" cy="-46" r="4" fill="#ffffff" />
      <circle cx="16" cy="-30" r="4" fill="#ffffff" />
    </g>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)" />

  <!-- Smiling sun -->
  <circle cx="1380" cy="150" r="98" fill="#fff3a3" opacity="0.5" />
  <circle cx="1380" cy="150" r="72" fill="#ffe14d" />
  <ellipse cx="1358" cy="138" rx="6" ry="9" fill="#7a4b00" />
  <ellipse cx="1402" cy="138" rx="6" ry="9" fill="#7a4b00" />
  <circle cx="1342" cy="162" r="9" fill="#ff9aa2" opacity="0.6" />
  <circle cx="1418" cy="162" r="9" fill="#ff9aa2" opacity="0.6" />
  <path d="M1356 165 Q1380 188 1404 165" fill="none" stroke="#7a4b00" stroke-width="5" stroke-linecap="round" />

  <use href="#cloud" transform="translate(290 140)" />
  <use href="#cloud" transform="translate(800 95) scale(0.8)" />
  <use href="#cloud" transform="translate(1110 215) scale(0.6)" />
  <use href="#cloud" transform="translate(560 260) scale(0.5)" opacity="0.85" />

  <!-- Far hills and trees -->
  <path d="M0 560 Q200 470 400 540 T800 520 T1200 530 T1600 500 V900 H0 Z" fill="#a3e79a" />
  <g color="#7fd67d">
    <use href="#tree" transform="translate(60 575) scale(0.45)" />
    <use href="#pine" transform="translate(150 570) scale(0.45)" color="#62c46e" />
    <use href="#tree" transform="translate(245 565) scale(0.5)" />
    <use href="#tree" transform="translate(340 570) scale(0.42)" />
    <use href="#pine" transform="translate(470 575) scale(0.48)" color="#62c46e" />
    <use href="#tree" transform="translate(570 570) scale(0.45)" />
    <use href="#tree" transform="translate(700 565) scale(0.5)" />
    <use href="#pine" transform="translate(790 570) scale(0.42)" color="#62c46e" />
    <use href="#tree" transform="translate(905 570) scale(0.46)" />
    <use href="#tree" transform="translate(1015 572) scale(0.42)" />
    <use href="#pine" transform="translate(1125 568) scale(0.5)" color="#62c46e" />
    <use href="#tree" transform="translate(1235 572) scale(0.45)" />
    <use href="#tree" transform="translate(1335 565) scale(0.5)" />
    <use href="#pine" transform="translate(1450 568) scale(0.45)" color="#62c46e" />
    <use href="#tree" transform="translate(1555 565) scale(0.48)" />
  </g>

  <!-- Middle hills and trees -->
  <path d="M0 650 Q250 580 500 640 T1000 630 T1600 620 V900 H0 Z" fill="#72d46c" />
  <g color="#46bf52">
    <use href="#tree" transform="translate(120 680) scale(0.75)" />
    <use href="#tree" transform="translate(300 675) scale(0.7)" />
    <use href="#pine" transform="translate(425 680) scale(0.75)" color="#2fa84a" />
    <use href="#tree" transform="translate(640 675) scale(0.72)" />
    <use href="#pine" transform="translate(770 680) scale(0.7)" color="#2fa84a" />
    <use href="#tree" transform="translate(980 678) scale(0.75)" />
    <use href="#pine" transform="translate(1105 675) scale(0.72)" color="#2fa84a" />
    <use href="#tree" transform="translate(1265 680) scale(0.7)" />
    <use href="#pine" transform="translate(1445 678) scale(0.75)" color="#2fa84a" />
  </g>

  <!-- Front meadow -->
  <path d="M0 760 Q300 710 600 750 T1200 745 T1600 735 V900 H0 Z" fill="#4cc95a" />

  <g color="#ff7eb6">
    <use href="#flower" transform="translate(385 830)" />
    <use href="#flower" transform="translate(425 850) scale(0.8)" color="#b197fc" />
    <use href="#flower" transform="translate(560 815)" color="#ffffff" />
    <use href="#flower" transform="translate(700 860) scale(0.9)" />
    <use href="#flower" transform="translate(860 825) scale(0.85)" color="#ffa94d" />
    <use href="#flower" transform="translate(1000 855)" color="#b197fc" />
    <use href="#flower" transform="translate(1150 820) scale(0.9)" />
    <use href="#flower" transform="translate(1210 865) scale(0.8)" color="#ffffff" />
  </g>
  <use href="#mushroom" transform="translate(330 845)" />
  <use href="#mushroom" transform="translate(1290 855) scale(0.85)" />

  <!-- Large trees framing the edges -->
  <use href="#tree" transform="translate(70 830) scale(1.3)" color="#2fae45" />
  <use href="#pine" transform="translate(235 840) scale(1.1)" color="#22924a" />
  <use href="#pine" transform="translate(1385 845) scale(1.1)" color="#22924a" />
  <use href="#tree" transform="translate(1540 830) scale(1.3)" color="#2fae45" />
</svg>
